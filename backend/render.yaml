services:
  - type: web
    name: dit-hr-recruitment-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DB_PATH
        value: /var/data/recruitment.db
    disk:
      name: recruitment-data
      mountPath: /var/data
      sizeGB: 1
